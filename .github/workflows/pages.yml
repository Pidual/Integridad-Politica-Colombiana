# Publica la carpeta web/ en GitHub Pages (gratis): https://<usuario>.github.io/<repo>/
# Activar una vez: Settings → Pages → Build and deployment → Source: "GitHub Actions".
# Estructura de la plantilla oficial: un trabajo construye y sube el paquete; otro lo publica.
name: Publicar sitio

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
